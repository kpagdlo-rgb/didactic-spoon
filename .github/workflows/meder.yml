name: Meder verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.1'
      # Next dev/build runs under the Node runtime; Bun 1.3.1 SIGILLs on `next build`.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-preview.txt
      - run: python -m unittest discover -s tests -v
      - run: bun install --frozen-lockfile
        working-directory: apps/meder
      - run: bun run typecheck && bun run test && bun run build
        working-directory: apps/meder
      # The runner's Google-Chrome apt source intermittently (and at times
      # persistently) serves a hash-sum-mismatched index, which fails
      # `--with-deps`. Playwright needs only Ubuntu packages from that step,
      # never Google Chrome, so mask the source and install deps + browser
      # separately. Retry once for CDN wobble.
      - name: Install Playwright Chromium
        working-directory: apps/meder
        run: |
          for attempt in 1 2; do
            sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
              /etc/apt/sources.list.d/google*.list 2>/dev/null || true
            if bunx playwright install-deps chromium \
              && bunx playwright install chromium; then
              exit 0
            fi
            echo "::warning::playwright install attempt $attempt failed; retrying"
            sleep 10
          done
          exit 1
      - run: bun run test:browser
        working-directory: apps/meder
